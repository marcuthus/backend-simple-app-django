[project]
name = "backend-simple-app-django"
version = "0.1.0"
description = "Template de backend Django REST Framework com Django Admin, JWT, API Key e compatibilidade total com o ecossistema simple-app."
authors = [
    {name = "Marcuth",email = "me@marcuth.dev"}
]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "django>=4.2,<5.0",
    "djangorestframework>=3.14.0,<3.16.0",
    "djangorestframework-simplejwt>=5.3.0,<5.4.0",
    "drf-spectacular>=0.27.0",
    "django-cors-headers>=4.3.0",
    "python-decouple>=3.8",
    "cryptography>=41.0.0",
    "djangorestframework-camel-case>=1.4.2",
    "dj-database-url>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "gunicorn>=21.2.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
